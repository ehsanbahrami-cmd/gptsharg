
name: Build Android APK from uploaded ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'DischargePlan_Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project ZIP
        run: |
          test -f DischargePlan_Source.zip
          mkdir -p project-src
          unzip -q DischargePlan_Source.zip -d project-src
          test -f project-src/settings.gradle.kts
          test -f project-src/app/build.gradle.kts

      - name: Build debug APK
        run: gradle --no-daemon -p project-src assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DischargePlan-debug-apk
          path: project-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
